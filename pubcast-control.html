<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubCast Avatar Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --amber: #b8956a;
      --ice: #4dc8ff;
      --ink: #0a0a0f;
      --panel: #1a1410;
      --text: #e8dcc8;
      --text-dim: #a8a898;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: var(--ink);
      font-family: 'Courier Prime', monospace;
      color: var(--text);
    }
    #canvas { display: block; width: 100%; height: 100%; }
    
    #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

    .hud { position: absolute; background: rgba(10,9,5,0.85); border: 2px solid var(--amber); padding: 14px; font-size: 11px; letter-spacing: 0.5px; }

    #top { top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    #title { font-size: 16px; font-weight: bold; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
    #status { text-align: right; }
    .status-line { color: var(--text-dim); margin: 3px 0; }
    .status-val { color: var(--text); font-weight: bold; }

    #right { top: 100px; right: 20px; width: 320px; max-height: 75vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; pointer-events: all; }

    .form-group {
      background: rgba(10,9,5,0.9);
      border: 1px solid var(--amber);
      padding: 10px;
      border-radius: 4px;
    }

    .form-label { color: var(--gold); font-size: 9px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; display: block; }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }

    button {
      background: var(--panel);
      border: 2px solid var(--gold);
      color: var(--gold);
      padding: 8px 12px;
      font-size: 10px;
      font-family: 'Courier Prime', monospace;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      pointer-events: all;
    }

    button:hover { background: var(--gold); color: var(--panel); transform: translateY(-2px); }
    button.active { background: var(--gold); color: var(--panel); }
    button.playing { background: #28c870; border-color: #28c870; color: var(--panel); }

    input[type="range"], input[type="color"], select {
      width: 100%;
      padding: 4px;
      margin-bottom: 4px;
      background: var(--panel);
      border: 1px solid var(--amber);
      color: var(--text);
      font-family: 'Courier Prime', monospace;
      cursor: pointer;
    }

    .input-row { display: flex; gap: 6px; align-items: center; font-size: 9px; margin-bottom: 4px; }
    .input-row label { flex: 0 0 50px; color: var(--text-dim); }
    .input-row input { flex: 1; }
    .input-val { flex: 0 0 45px; text-align: right; color: var(--gold); font-weight: bold; }

    #left { bottom: 20px; left: 20px; pointer-events: all; }
    .control-label { color: var(--amber); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }

    .timeline {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--amber);
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .timeline-bar { width: 100%; height: 4px; background: var(--panel); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
    .timeline-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.1s linear; }
    .timeline-info { font-size: 8px; color: var(--text-dim); display: flex; justify-content: space-between; }

    #right::-webkit-scrollbar { width: 6px; }
    #right::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    #right::-webkit-scrollbar-thumb { background: var(--amber); border-radius: 3px; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="top" class="hud">
    <div id="title">PubCast Avatar Control</div>
    <div id="status">
      <div class="status-line">Avatar: <span class="status-val" id="avatar-name">—</span></div>
      <div class="status-line">Status: <span class="status-val" id="status-text">ready</span></div>
      <div class="status-line">FPS: <span class="status-val" id="fps-val">—</span></div>
    </div>
  </div>

  <div id="right" class="hud">
    <div class="form-group">
      <label class="form-label">Avatar Selection</label>
      <div class="btn-group">
        <button id="btn-manny" class="active" onclick="selectAvatar('manny')">Manny</button>
        <button id="btn-sheila" onclick="selectAvatar('sheila')">Sheila</button>
      </div>
      <div class="btn-group">
        <button style="flex: 1;" onclick="loadAvatar()">LOAD GLB</button>
        <button style="flex: 1;" onclick="spawnProcedural()">PROCEDURAL</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Animation Playback</label>
      <div class="timeline">
        <div class="timeline-bar"><div class="timeline-fill" id="timeline-fill"></div></div>
        <div class="timeline-info">
          <span id="anim-time">0.0s</span>
          <span id="anim-duration">0.0s</span>
          <span id="anim-progress">0%</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="btn-play" style="flex: 1;" onclick="playAnimation()">PLAY</button>
        <button style="flex: 1;" onclick="stopAnimation()">STOP</button>
      </div>
      <select id="anim-select" onchange="selectAnimation(this.value)">
        <option value="">— No Animation —</option>
        <option value="idle">Idle</option>
        <option value="walk">Walk</option>
        <option value="run">Run</option>
        <option value="nod_slow">Nod Slow</option>
        <option value="nod_emphatic">Nod Emphatic</option>
        <option value="head_shake">Head Shake</option>
        <option value="lean_forward">Lean Forward</option>
        <option value="shoulder_shrug">Shrug</option>
        <option value="hand_wave">Wave</option>
        <option value="hands_on_hips">Hands on Hips</option>
        <option value="confident_stance">Confident</option>
        <option value="thoughtful_idle">Thoughtful</option>
        <option value="enthusiastic">Enthusiastic</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Glow & Color</label>
      <label style="color: var(--text-dim); font-size: 9px; margin-bottom: 4px;">Glow Color</label>
      <input type="color" id="glow-color" value="#4dc8ff" onchange="updateGlowColor(this.value)">
    </div>

    <div class="form-group">
      <label class="form-label">Transform</label>
      <div class="input-row">
        <label>Height</label>
        <input type="range" id="height" min="150" max="210" value="175" onchange="updateHeight(this.value)">
        <span class="input-val" id="height-val">175</span>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Manual Pose</label>
      <div class="input-row">
        <label>Head Y</label>
        <input type="range" id="head-yaw" min="-45" max="45" value="0" onchange="updateHeadPose()">
      </div>
      <div class="input-row">
        <label>Head X</label>
        <input type="range" id="head-pitch" min="-30" max="30" value="0" onchange="updateHeadPose()">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Camera</label>
      <div class="btn-group">
        <button id="cam-orbit" class="active" style="flex: 1; min-width: 65px;" onclick="setCam('orbit')">Orbit</button>
        <button id="cam-front" style="flex: 1; min-width: 65px;" onclick="setCam('front')">Front</button>
        <button id="cam-close" style="flex: 1; min-width: 65px;" onclick="setCam('close')">Close</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Actions</label>
      <div class="btn-group">
        <button style="flex: 1;" onclick="resetAvatar()">RESET</button>
        <button style="flex: 1;" onclick="randomColor()">RANDOM</button>
      </div>
    </div>
  </div>

  <div id="left" class="hud">
    <div class="control-label">Animation Info</div>
    <div style="font-size: 9px; color: var(--text-dim);">
      <div id="info-animation">Animation: —</div>
      <div id="info-bones">Bones: —</div>
      <div id="info-clips">Clips: —</div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

/* ETHEREAL SHADER */
function createEtherealShader(hex = '#4dc8ff') {
  const color = new THREE.Color(hex);
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: color },
      uGlowColor: { value: color.clone().multiplyScalar(1.3) },
      uTime: { value: 0 },
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      uniform float uTime;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        vec3 pos = position;
        pos.x += sin(pos.y * 6.0 + uTime * 2.2) * 0.003;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform vec3 uGlowColor;
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      void main() {
        vec3 viewDir = normalize(cameraPosition - vWorldPos);
        float fresnel = pow(1.0 - abs(dot(vNormal, viewDir)), 2.2);
        vec3 col = uColor * 0.45 + uGlowColor * fresnel * 2.0;
        float pulse = sin(uTime * 2.0 + vWorldPos.y * 3.0) * 0.3 + 0.7;
        col *= pulse;
        gl_FragColor = vec4(col, 0.72 + fresnel * 0.15);
      }
    `,
    transparent: true,
    side: THREE.FrontSide,
  });
}

/* SCENE */
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x0a0a0f, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 3.5);
camera.lookAt(0, 1.2, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.SpotLight(0xfff0cc, 2.0, 60, Math.PI / 5, 0.6, 1.5);
key.position.set(3, 4, 3);
key.castShadow = true;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x5588ff, 0.4).position.set(-3, 2, -2), new THREE.DirectionalLight(0x5588ff, 0.4));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x0d0905 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* STATE */
let currentAvatar = null;
let currentId = 'manny';
let glowColor = '#4dc8ff';
let playingAnim = null;
let animStartTime = 0;
let glbAnimationMixer = null;
let glbAnimationClips = [];

function createProceduralAvatar(id, hex) {
  if (currentAvatar) scene.remove(currentAvatar.group);
  glbAnimationMixer = null;
  glbAnimationClips = [];

  const mat = createEtherealShader(hex);
  const group = new THREE.Group();

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), mat);
  head.position.y = 1.35;
  head.castShadow = true;
  group.add(head);

  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.55, 8, 12), mat);
  body.position.y = 0.75;
  body.castShadow = true;
  group.add(body);

  const armL = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.35, 6, 8), mat);
  armL.position.set(0.35, 0.85, 0);
  const armR = armL.clone();
  armR.position.x = -0.35;
  group.add(armL, armR);

  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.4, 6, 8), mat);
  legL.position.set(0.12, 0.3, 0);
  const legR = legL.clone();
  legR.position.x = -0.12;
  group.add(legL, legR);

  scene.add(group);

  currentAvatar = {
    id,
    group,
    materials: [mat],
    bones: { head },
    isGLB: false,
  };

  updateStatus('Avatar', `${id.toUpperCase()} · Procedural`);
  updateAnimInfo();
}

window.selectAvatar = (name) => {
  currentId = name;
  document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${name}`).classList.add('active');
};

window.loadAvatar = async () => {
  if (currentAvatar) scene.remove(currentAvatar.group);

  const loader = new GLTFLoader();
  try {
    const gltf = await loader.loadAsync(`${currentId}.glb`);
    const model = gltf.scene;
    model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(model);

    glbAnimationMixer = new THREE.AnimationMixer(model);
    glbAnimationClips = gltf.animations || [];

    currentAvatar = {
      id: currentId,
      group: model,
      materials: [],
      isGLB: true,
      mixer: glbAnimationMixer,
      clips: glbAnimationClips,
    };

    updateStatus('Avatar', `${currentId}.glb`);
    updateAnimInfo();
  } catch (e) {
    console.log('GLB failed:', e.message);
    createProceduralAvatar(currentId, glowColor);
  }
};

window.spawnProcedural = () => createProceduralAvatar(currentId, glowColor);

window.updateGlowColor = (hex) => {
  glowColor = hex;
  if (currentAvatar?.materials) {
    currentAvatar.materials.forEach(mat => {
      if (mat.uniforms?.uColor) mat.uniforms.uColor.value.set(hex);
      if (mat.uniforms?.uGlowColor) mat.uniforms.uGlowColor.value = new THREE.Color(hex).multiplyScalar(1.3);
    });
  }
};

window.updateHeight = (val) => {
  document.getElementById('height-val').textContent = val;
  if (currentAvatar?.group) currentAvatar.group.scale.y = val / 175;
};

window.updateHeadPose = () => {
  const yaw = (parseFloat(document.getElementById('head-yaw').value) * Math.PI) / 180;
  const pitch = (parseFloat(document.getElementById('head-pitch').value) * Math.PI) / 180;
  if (currentAvatar?.bones?.head && !currentAvatar.isGLB) {
    currentAvatar.bones.head.rotation.y = yaw;
    currentAvatar.bones.head.rotation.x = pitch;
  }
};

window.selectAnimation = (name) => {
  playingAnim = name;
  if (!name || !currentAvatar?.isGLB) return;

  const clip = THREE.AnimationClip.findByName(glbAnimationClips, name);
  if (clip && glbAnimationMixer) {
    glbAnimationMixer.stopAllAction();
    const action = glbAnimationMixer.clipAction(clip);
    action.play();
    document.getElementById('info-animation').textContent = `Animation: ${name}`;
  }
};

window.playAnimation = () => {
  playingAnim = document.getElementById('anim-select').value;
  animStartTime = performance.now() / 1000;
  if (playingAnim && currentAvatar?.isGLB) window.selectAnimation(playingAnim);
  document.getElementById('btn-play').classList.add('playing');
};

window.stopAnimation = () => {
  playingAnim = null;
  if (glbAnimationMixer) glbAnimationMixer.stopAllAction();
  document.getElementById('btn-play').classList.remove('playing');
};

window.resetAvatar = () => {
  document.getElementById('height').value = 175;
  document.getElementById('head-yaw').value = 0;
  document.getElementById('head-pitch').value = 0;
  window.updateHeight(175);
  window.updateHeadPose();
  window.stopAnimation();
};

window.randomColor = () => {
  const colors = ['#4dc8ff', '#ff6b9d', '#00ff88', '#ffc940', '#ff4500', '#9d4edd'];
  const hex = colors[Math.floor(Math.random() * colors.length)];
  document.getElementById('glow-color').value = hex;
  window.updateGlowColor(hex);
};

window.setCam = (mode) => {
  document.querySelectorAll('[id^="cam-"]').forEach(b => b.classList.remove('active'));
  document.getElementById(`cam-${mode}`).classList.add('active');
  controls.autoRotate = mode === 'orbit';
  if (mode === 'front') camera.position.set(0, 1.2, 5);
  else if (mode === 'close') camera.position.set(0, 1.2, 2);
  else camera.position.set(0, 1.5, 3.5);
  camera.lookAt(0, 1.2, 0);
};

function updateStatus(label, value) {
  if (label === 'Avatar') {
    document.getElementById('avatar-name').textContent = value;
    document.getElementById('status-text').textContent = value.includes('GLB') ? 'glb' : 'procedural';
  }
}

function updateAnimInfo() {
  if (!currentAvatar) {
    document.getElementById('info-bones').textContent = 'Bones: —';
    document.getElementById('info-clips').textContent = 'Clips: —';
    return;
  }

  const boneCount = Object.keys(currentAvatar.bones || {}).length;
  document.getElementById('info-bones').textContent = `Bones: ${boneCount}`;
  
  const clipCount = currentAvatar.clips?.length || 0;
  document.getElementById('info-clips').textContent = `Clips: ${clipCount}`;
}

/* RENDER */
const clock = new THREE.Clock();
let frameCount = 0, fpsTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  controls.update();

  if (currentAvatar?.materials) {
    currentAvatar.materials.forEach(mat => {
      if (mat.uniforms?.uTime) mat.uniforms.uTime.value += dt;
    });
  }

  if (glbAnimationMixer) glbAnimationMixer.update(dt);

  if (playingAnim) {
    const elapsed = performance.now() / 1000 - animStartTime;
    const duration = glbAnimationClips.find(c => c.name === playingAnim)?.duration || 1;
    document.getElementById('anim-time').textContent = elapsed.toFixed(1) + 's';
    document.getElementById('anim-duration').textContent = duration.toFixed(1) + 's';
    const progress = Math.min(elapsed / duration, 1);
    document.getElementById('timeline-fill').style.width = (progress * 100) + '%';
    document.getElementById('anim-progress').textContent = (progress * 100).toFixed(0) + '%';
    if (progress >= 1) window.stopAnimation();
  }

  fpsTime += dt;
  frameCount++;
  if (fpsTime >= 0.5) {
    document.getElementById('fps-val').textContent = Math.round(frameCount / fpsTime);
    fpsTime = frameCount = 0;
  }

  renderer.render(scene, camera);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', onResize);
onResize();
animate();

createProceduralAvatar('manny', '#4dc8ff');

console.log('[PubCast] Avatar Control Online');
</script>

</body>
</html>
