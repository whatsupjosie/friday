<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubCast - The Dressing Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Courier Prime', monospace;
      background: #0a0a0f;
      background-image: 
        radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(77, 200, 255, 0.05) 0%, transparent 50%);
      color: #d4d0c8;
      overflow: hidden;
    }

    html { height: 100%; }
    body { height: 100vh; }

    .stage {
      display: grid;
      grid-template-columns: 1fr 2.5fr 0.8fr;
      height: 100vh;
      gap: 12px;
      padding: 20px;
    }

    /* ============== MIRROR PANEL ============== */
    .mirror-panel {
      background: linear-gradient(135deg, #1a1a24 0%, #252530 50%, #1a1a24 100%);
      border: 3px solid #b8956a;
      border-radius: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 
        inset 0 1px 0 #ffffff40,
        inset 0 -1px 0 #00000080,
        0 0 60px rgba(184, 149, 106, 0.2);
    }

    .mirror-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 2px
      );
      pointer-events: none;
      z-index: 1;
    }

    .mirror-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 4px double #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(77, 200, 255, 0.05), transparent);
      margin-bottom: 20px;
      z-index: 2;
    }

    #preview-canvas {
      width: 90%;
      height: 90%;
      image-rendering: crisp-edges;
    }

    .nameboard {
      width: 100%;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), rgba(77, 200, 255, 0.08));
      border: 2px solid #b8956a;
      border-top: 3px solid #d4af37;
      padding: 16px;
      text-align: center;
      z-index: 2;
    }

    .avatar-name {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: #d4af37;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
      margin-bottom: 10px;
    }

    .vital-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 10px;
      font-family: 'Courier Prime';
    }

    .stat {
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border-left: 3px solid #d4af37;
      color: #a8a898;
    }

    .stat-value {
      color: #d4af37;
      font-weight: 700;
    }

    /* ============== CONTROL CONSOLE ============== */
    .console {
      background: linear-gradient(135deg, #161620 0%, #1f1a2e 50%, #161620 100%);
      border: 3px solid #b8956a;
      border-radius: 1px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 
        inset 0 1px 0 #ffffff40,
        inset 0 -1px 0 #00000080,
        0 0 60px rgba(184, 149, 106, 0.2);
      position: relative;
    }

    .console::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 2px
      );
      pointer-events: none;
      z-index: 0;
    }

    .console-header {
      background: linear-gradient(90deg, #d4af3740, #4dc8ff20);
      border-bottom: 2px solid #b8956a;
      padding: 14px 20px;
      font-family: 'Orbitron';
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #d4af37;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      z-index: 2;
    }

    .console-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      z-index: 1;
    }

    .form-section {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed rgba(212, 175, 55, 0.3);
    }

    .form-section:last-child { border-bottom: none; }

    .section-header {
      font-family: 'Orbitron';
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4dc8ff;
      margin-bottom: 12px;
      padding-left: 8px;
      border-left: 2px solid #d4af37;
    }

    .form-row {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #a8a898;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      text-transform: capitalize;
    }

    input[type="text"],
    input[type="color"],
    select {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #b8956a;
      border-left: 3px solid #d4af37;
      color: #d4d0c8;
      font-family: 'Courier Prime';
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2), 0 0 10px rgba(212, 175, 55, 0.2);
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, #b8956a40, #4dc8ff40);
      border: 1px solid #b8956a;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d4af37, #b8956a);
      border: 2px solid #8b7355;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.6), inset -1px -1px 3px #00000060;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.8), inset -1px -1px 3px #00000060;
    }

    .value-display {
      float: right;
      color: #d4af37;
      font-weight: 700;
      font-size: 10px;
    }

    .color-swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .swatch {
      aspect-ratio: 1;
      border: 2px solid #b8956a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .swatch:hover {
      transform: scale(1.1);
      border-color: #d4af37;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
    }

    .swatch.active {
      border: 3px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
    }

    /* ============== ACTION STATION ============== */
    .station {
      background: linear-gradient(135deg, #1a1620 0%, #252030 50%, #1a1620 100%);
      border: 3px solid #b8956a;
      border-radius: 1px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 
        inset 0 1px 0 #ffffff40,
        inset 0 -1px 0 #00000080,
        0 0 60px rgba(184, 149, 106, 0.2);
      position: relative;
      z-index: 2;
    }

    .station::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 2px
      );
      pointer-events: none;
    }

    .station-section {
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .station-label {
      font-family: 'Orbitron';
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4dc8ff;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #b8956a;
    }

    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(180deg, #b8956a, #8b7355);
      color: #0a0a0f;
      border: 2px solid #d4af37;
      font-family: 'Orbitron';
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
      box-shadow: inset 0 1px 0 #ffffff40, 0 4px 12px #00000060;
      text-shadow: 0 1px 2px #00000040;
    }

    button:hover {
      background: linear-gradient(180deg, #d4af37, #b8956a);
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 #ffffff40, 0 8px 20px rgba(212, 175, 55, 0.3);
    }

    button:active {
      transform: translateY(0);
      box-shadow: inset 0 -1px 0 #00000060, 0 2px 4px #00000080;
    }

    .btn-primary {
      background: linear-gradient(180deg, #d4af37, #b8956a);
      color: #0a0a0f;
      margin-top: 12px;
      font-weight: 900;
    }

    .status {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #b8956a;
      color: #d4af37;
      padding: 10px;
      text-align: center;
      font-size: 10px;
      font-family: 'Courier Prime';
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.4);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #b8956a, #8b7355);
      border: 1px solid #d4af37;
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #d4af37, #b8956a);
    }

  </style>
</head>
<body>
  <div class="stage">
    <!-- MIRROR -->
    <div class="mirror-panel">
      <div class="mirror-frame">
        <canvas id="preview-canvas"></canvas>
      </div>
      <div class="nameboard">
        <div class="avatar-name" id="avatar-name">AVATAR</div>
        <div class="vital-stats">
          <div class="stat"><span class="stat-label">HEIGHT</span><br><span class="stat-value" id="stat-height">175</span>cm</div>
          <div class="stat"><span class="stat-label">BUILD</span><br><span class="stat-value" id="stat-girth">0.50</span></div>
          <div class="stat"><span class="stat-label">GENDER</span><br><span class="stat-value" id="stat-gender">NEUTRAL</span></div>
          <div class="stat"><span class="stat-label">MOOD</span><br><span class="stat-value" id="stat-mood">CALM</span></div>
        </div>
      </div>
    </div>

    <!-- CONSOLE -->
    <div class="console">
      <div class="console-header">⬡ Avatar Customization Console</div>
      <div class="console-body">

        <div class="form-section">
          <div class="section-header">IDENTITY</div>
          <div class="form-row">
            <label>Display Name</label>
            <input type="text" id="display-name" maxlength="32">
          </div>
          <div class="form-row">
            <label>Gender</label>
            <select id="gender">
              <option value="neutral">Neutral</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
            </select>
          </div>
        </div>

        <div class="form-section">
          <div class="section-header">FACE GEOMETRY</div>
          <div class="form-row">
            <label>Face Shape</label>
            <select id="face-shape">
              <option>Oval</option>
              <option>Round</option>
              <option>Square</option>
              <option>Heart</option>
            </select>
          </div>
          <div class="form-row">
            <label>Cheekbone Height <span class="value-display" id="val-cheek">0.50</span></label>
            <input type="range" id="cheekbone" min="0" max="1" step="0.05" value="0.5">
          </div>
          <div class="form-row">
            <label>Jaw Width <span class="value-display" id="val-jaw">0.50</span></label>
            <input type="range" id="jaw" min="0" max="1" step="0.05" value="0.5">
          </div>
        </div>

        <div class="form-section">
          <div class="section-header">HAIR SYSTEM</div>
          <div class="form-row">
            <label>Style</label>
            <select id="hair-style">
              <option>Short</option>
              <option>Shoulder</option>
              <option>Long</option>
              <option>Waves</option>
            </select>
          </div>
          <div class="form-row">
            <label>Color</label>
            <input type="color" id="hair-color" value="#8B5A2B">
          </div>
          <div class="form-row">
            <label>Length <span class="value-display" id="val-hair">1.00</span></label>
            <input type="range" id="hair-length" min="0.5" max="1.5" step="0.1" value="1">
          </div>
        </div>

        <div class="form-section">
          <div class="section-header">EYES</div>
          <div class="form-row">
            <label>Color</label>
            <input type="color" id="eye-color" value="#4DC8FF">
          </div>
          <div class="form-row">
            <label>Size <span class="value-display" id="val-eye">1.00</span></label>
            <input type="range" id="eye-size" min="0.5" max="1.5" step="0.1" value="1">
          </div>
        </div>

        <div class="form-section">
          <div class="section-header">BODY BUILD</div>
          <div class="form-row">
            <label>Height <span class="value-display" id="val-height">175</span>cm</label>
            <input type="range" id="height" min="150" max="210" step="2" value="175">
          </div>
          <div class="form-row">
            <label>Build / Girth <span class="value-display" id="val-girth-input">0.50</span></label>
            <input type="range" id="girth" min="0" max="1" step="0.05" value="0.5">
          </div>
          <div class="form-row">
            <label>Musculature <span class="value-display" id="val-muscle">0.50</span></label>
            <input type="range" id="muscle" min="0" max="1" step="0.05" value="0.5">
          </div>
        </div>

        <div class="form-section" id="anatomy-section" style="display:none;">
          <div class="section-header">ANATOMY</div>
          <div class="form-row">
            <label>Breast Size <span class="value-display" id="val-breast">0.50</span></label>
            <input type="range" id="breast" min="0" max="1" step="0.1" value="0.5">
          </div>
        </div>

        <div class="form-section">
          <div class="section-header">AESTHETIC</div>
          <div class="form-row">
            <label>Glow Color</label>
            <div class="color-swatches">
              <div class="swatch active" style="background:#4DC8FF;" data-color="#4DC8FF"></div>
              <div class="swatch" style="background:#FFC940;" data-color="#FFC940"></div>
              <div class="swatch" style="background:#FF6B1A;" data-color="#FF6B1A"></div>
              <div class="swatch" style="background:#00FF88;" data-color="#00FF88"></div>
              <div class="swatch" style="background:#FF4FE2;" data-color="#FF4FE2"></div>
            </div>
          </div>
          <div class="form-row">
            <label>Mood</label>
            <select id="mood">
              <option>Calm</option>
              <option>Happy</option>
              <option>Energetic</option>
              <option>Excited</option>
            </select>
          </div>
        </div>

      </div>
    </div>

    <!-- STATION -->
    <div class="station">
      <div class="station-section">
        <div class="station-label">Quick Actions</div>
        <button onclick="randomize()">⚡ Randomize</button>
        <button onclick="resetAll()">↺ Reset</button>
      </div>

      <div class="station-section">
        <div class="station-label">Presets</div>
        <button onclick="preset('azure')">Azure</button>
        <button onclick="preset('neon')">Neon</button>
        <button onclick="preset('nova')">Nova</button>
      </div>

      <div class="status" id="status">Ready</div>

      <button class="btn-primary" onclick="saveAvatar()">✓ SAVE AVATAR</button>
    </div>
  </div>

  <script type="module">
    import UnifiedAvatarSystem from './avatar_unified_system.js';

    let avatarSystem;
    let currentId = 'manny';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
    camera.position.set(0, 0, 2);

    const canvas = document.getElementById('preview-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(canvas.offsetWidth, canvas.offsetHeight);
    renderer.setClearColor(0x0a0a0f, 1);

    avatarSystem = new UnifiedAvatarSystem(scene);

    async function init() {
      await avatarSystem.spawnProcedural(currentId, { color: '#4DC8FF' });
      updateUI();
      animate();
    }

    function updateUI() {
      const avatar = avatarSystem.avatars.get(currentId);
      if (!avatar) return;

      document.getElementById('avatar-name').textContent = document.getElementById('display-name').value || currentId.toUpperCase();
      document.getElementById('stat-height').textContent = avatar.morphs.height || 175;
      document.getElementById('stat-gender').textContent = (avatar.morphs.gender || 'neutral').toUpperCase();
      document.getElementById('stat-girth').textContent = ((avatar.morphs.girth || 0.5).toFixed(2));
      document.getElementById('stat-mood').textContent = (avatar.morphs.mood || 'calm').toUpperCase();
    }

    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('change', (e) => {
        const name = e.target.id;
        const value = e.target.value;
        if (name === 'gender') {
          avatarSystem.updateGender(currentId, value);
          document.getElementById('anatomy-section').style.display = value === 'female' ? 'block' : 'none';
        } else {
          avatarSystem.updateMorph(currentId, name, isNaN(value) ? value : parseFloat(value));
        }
        updateUI();
        renderer.render(scene, camera);
      });

      el.addEventListener('input', () => {
        const valId = `val-${el.id}`;
        const valEl = document.getElementById(valId);
        if (valEl) valEl.textContent = parseFloat(el.value).toFixed(2);
      });
    });

    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', (e) => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        avatarSystem.updateMorph(currentId, 'glowColor', swatch.dataset.color);
      });
    });

    function saveAvatar() {
      const avatar = avatarSystem.avatars.get(currentId);
      const data = {
        name: document.getElementById('display-name').value,
        morphs: avatar.morphs,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem(`avatar_${currentId}`, JSON.stringify(data));
      document.getElementById('status').textContent = '✓ SAVED';
      setTimeout(() => {
        document.getElementById('status').textContent = 'Ready';
      }, 2000);
    }

    function randomize() {
      document.querySelectorAll('input[type="range"]').forEach(el => {
        el.value = Math.random() * (el.max - el.min) + parseFloat(el.min);
        el.dispatchEvent(new Event('input'));
        el.dispatchEvent(new Event('change'));
      });
    }

    function resetAll() {
      document.querySelectorAll('input[type="range"]').forEach(el => {
        el.value = el.dataset.default || 0.5;
        el.dispatchEvent(new Event('input'));
      });
    }

    function preset(name) {
      const presets = {
        azure: { 'eye-color': '#4DC8FF', 'hair-color': '#1a4d7a', mood: 'Calm' },
        neon: { 'eye-color': '#00FF88', 'hair-color': '#00FF88', mood: 'Energetic' },
        nova: { 'eye-color': '#FF4FE2', 'hair-color': '#FF1493', mood: 'Excited' }
      };
      const p = presets[name];
      if (p) {
        for (const [key, val] of Object.entries(p)) {
          const el = document.getElementById(key);
          if (el) {
            el.value = val;
            el.dispatchEvent(new Event('change'));
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
